name: Poll and Deploy

# Cron poll of polttoaine.net, JSON export, commit fuel.db + eu.db back to
# main, then deploy Pages from site/. Two jobs:
#
#   poll    polls, exports, commits, and uploads the Pages artifact. The upload
#           has to share a job with export.py: site/data/*.json is gitignored
#           and exists only in that runner's workspace, so a separate job
#           checking out main would find no JSON at all.
#   deploy  runs deploy-pages on its own. It can't share a job with the upload
#           because deploy-pages sometimes queries the artifact list before
#           GitHub has registered the upload and fails with "No artifacts named
#           github-pages were found" (actions/deploy-pages#451). A job boundary
#           avoids that race. It also means "Re-run failed jobs" is safe: it
#           reruns only deploy, not the poll or the commit.
#
# The commit step rebases onto origin/main before pushing: the job checks out
# main when it starts, so a manual push landing mid-run would otherwise make
# the bare push non-fast-forward, fail the run, and lose that poll's data
# until the next cron fires.
#
# Shares the "pages" concurrency group with pages.yml so the two workflows
# never deploy at once. GITHUB_TOKEN pushes don't trigger pages.yml, which is
# why this workflow deploys for itself.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run poller
        run: python poll.py

      - name: Update EU bulletin
        run: python eu_bulletin.py

      - name: Export JSON
        run: python export.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fuel.db eu.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "poll: update fuel prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: poll
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
