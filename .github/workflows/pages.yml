name: Deploy Pages

# Covers manual pushes that touch the site. Bot poll commits are deployed by
# poll.yml itself (GITHUB_TOKEN pushes don't trigger this workflow).
#
# site/data/*.json is gitignored, so the checkout has no JSON in it — this
# workflow regenerates it from the committed fuel.db + eu.db with export.py
# before uploading the artifact, or it would deploy a dataless site.
#
# Two jobs. build regenerates the JSON and uploads the Pages artifact (the
# upload has to share a job with export.py, since the JSON exists only in that
# runner's workspace). deploy runs deploy-pages on its own, because in the same
# job it sometimes queries the artifact list before GitHub has registered the
# upload and fails with "No artifacts named github-pages were found"
# (actions/deploy-pages#451). "Re-run failed jobs" is safe: it reruns only
# deploy.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Export JSON
        run: python export.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
